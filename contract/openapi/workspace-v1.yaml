      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateGeneration' } } } }
      responses: { '201': { description: Generation with committed receipt, content: { application/json: { schema: { $ref: '#/components/schemas/CommittedMutation' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/generations/{generation_id}:
    get:
