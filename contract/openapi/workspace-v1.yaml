  /v1/attempts/{attempt_id}/settle:
    post:
      operationId: settleAttempt
      parameters: [ { $ref: '#/components/parameters/AttemptId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: './schemas/worker.json#/definitions/Settlement' } } } }
      responses: { '200': { description: Settled with committed receipt, content: { application/json: { schema: { $ref: '#/components/schemas/CommittedMutation' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/attempts/{attempt_id}/prepare-reboot:
    post:
      operationId: prepareReboot
      parameters: [ { $ref: '#/components/parameters/AttemptId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryPrepare' } } } }
      responses: { '200': { description: Durable recovery authorization, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryAuthorization' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/attempts/{attempt_id}/checkpoint:
    post:
      operationId: checkpointAttempt
      parameters: [ { $ref: '#/components/parameters/AttemptId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryCheckpoint' } } } }
      responses: { '201': { description: Durable checkpoint, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryCheckpointReceipt' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/attempts/{attempt_id}/publish-timeline-render:
    post:
      operationId: publishTimelineRender
      description: Fenced, replay-safe publication of one canonical timeline revision and the render task bound to it.
      parameters: [ { $ref: '#/components/parameters/AttemptId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [lease_id, fence, runtime_epoch, timeline_id, expected_version, config, registry, render], properties: { lease_id: { type: string }, fence: { type: integer }, runtime_epoch: { type: integer, minimum: 1 }, timeline_id: { type: string }, expected_version: { type: integer, minimum: 1 }, config: { type: object }, registry: { type: object }, render: { type: object }, slug: { type: string }, name: { type: string } } } } } }
      responses: { '200': { description: Durable timeline/render publication link, content: { application/json: { schema: { type: object } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/attempts/{attempt_id}/fail:
    post:
      operationId: failAttempt
      parameters: [ { $ref: '#/components/parameters/AttemptId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AttemptFailure' } } } }
      responses: { '200': { description: Failed with committed receipt, content: { application/json: { schema: { $ref: '#/components/schemas/CommittedMutation' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/attempts/{attempt_id}/heartbeat:
    post:
      operationId: heartbeatAttempt
      parameters: [ { $ref: '#/components/parameters/AttemptId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Heartbeat' } } } }
      responses: { '200': { description: Lease renewed with committed receipt, content: { application/json: { schema: { $ref: '#/components/schemas/CommittedMutation' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/recovery/reboot:
    post:
      operationId: requestReboot
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryRequest' } } } }
      responses: { '200': { description: Reboot receipt, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryReceipt' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/recovery/resume:
    post:
      operationId: resumeAttempt
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryRequest' } } } }
      responses: { '200': { description: Resume receipt and exact attempt, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryResumeReceipt' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: workspace-scoped-token }
  parameters:
    Cursor: { name: cursor, in: query, required: false, schema: { type: string, minLength: 1 } }
    Limit: { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._~-]{0,255}$' } }
    ProjectId: { name: project_id, in: path, required: true, schema: { type: string } }
    ObjectId: { name: object_id, in: path, required: true, schema: { type: string } }
    TaskId: { name: task_id, in: path, required: true, schema: { type: string } }
    RunId: { name: run_id, in: path, required: true, schema: { type: string } }
    AttemptId: { name: attempt_id, in: path, required: true, schema: { type: string } }
    TimelineId: { name: timeline_id, in: path, required: true, schema: { type: string } }
    ShotId: { name: shot_id, in: path, required: true, schema: { type: string } }
    BindingId: { name: binding_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    ReferenceId: { name: reference_id, in: path, required: true, schema: { type: string } }
    DocumentId: { name: document_id, in: path, required: true, schema: { type: string } }
    GenerationId: { name: generation_id, in: path, required: true, schema: { type: string } }
    Range: { name: Range, in: header, required: false, schema: { type: string, pattern: '^bytes=[0-9]+-[0-9]*$' } }
  headers:
    ETag: { description: Strong digest validator, schema: { type: string, pattern: '^"sha256:[0-9a-f]{64}"$' } }
    AcceptRanges: { description: Supported range unit, schema: { type: string, const: bytes } }
    ContentRange: { description: Inclusive byte range, schema: { type: string, pattern: '^bytes [0-9]+-[0-9]+/[0-9]+$' } }
    ContentLength: { description: Number of response bytes, schema: { type: integer, minimum: 0 } }
  schemas:
    HandshakeResponse:
      type: object
      additionalProperties: false
      required: [protocol, schema_digest, session_id, actor_id, realm_id, scopes]
      properties:
        protocol: { type: string, const: workspace.v1 }
        schema_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        session_id: { type: string }
        actor_id: { type: string }
        realm_id: { type: string }
        scopes: { type: array, items: { type: string }, uniqueItems: true }
    CreateProject:
      type: object
      additionalProperties: false
      required: [name]
      properties: { name: { type: string, minLength: 1, maxLength: 512 }, slug: { type: string, minLength: 1, maxLength: 128 }, metadata: { type: object, additionalProperties: true } }
    UpdateProject:
      type: object
      additionalProperties: false
      properties:
        expected_version: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 512 }
        metadata: { type: object, additionalProperties: true }
    SelectProject:
      type: object
      additionalProperties: false
      required: [project]
      properties:
        project: { type: string, minLength: 1 }
        scope: { type: string, enum: [workspace, user], default: workspace }
    ProjectSelection:
      type: object
      additionalProperties: false
      required: [actor_id, scope, project, updated_at]
      properties:
        actor_id: { type: string }
        scope: { type: string, enum: [workspace, user] }
        project: { $ref: './schemas/project.json' }
        updated_at: { type: string }
    RunAction:
      type: object
      additionalProperties: false
      properties:
        selected_task_ids: { type: array, items: { type: string, minLength: 1 }, uniqueItems: true }
    ProjectPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: './schemas/project.json' } }
        next_cursor: { type: [string, 'null'] }
    ExpectedVersion:
      type: object
      additionalProperties: false
      properties: { expected_version: { type: integer, minimum: 1 } }
    AdmitTask:
      type: object
      additionalProperties: false
      required: [capability_id, capability_digest, input_object_ids]
      properties:
        capability_id: { type: string, minLength: 1 }
        capability_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        schema_version: { type: string, minLength: 1 }
        input_object_ids: { type: array, items: { type: string, description: Canonical sha256 object ID already associated with the task project. }, uniqueItems: true }
        required_facts: { $ref: './schemas/task.json#/definitions/RequiredFacts' }
        project: { type: string, description: Project selector whose managed-object associations authorize input_object_ids and output settlement. }
        spec: { type: object, additionalProperties: true }
        settlement_effect: { $ref: './schemas/worker.json#/definitions/Effect' }
        storage_estimate: { $ref: '#/components/schemas/StorageEstimate' }
    StorageEstimate:
      type: object
      additionalProperties: false
      required: [scratch_bytes, output_bytes]
      properties:
        scratch_bytes: { type: integer, minimum: 0, maximum: 9007199254740991 }
        output_bytes: { type: integer, minimum: 0, maximum: 9007199254740991 }
    EventPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties: { items: { type: array, items: { $ref: './schemas/event.json' } }, next_cursor: { type: [string, 'null'] } }
    TaskPage:
      type: object
