      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectReferenceUpdate' } } } }
      responses: { '200': { description: Updated project reference mutation, content: { application/json: { schema: { $ref: '#/components/schemas/CommittedMutation' } } } } }
  /v1/projects/{project_id}/references/{reference_id}/archive:
