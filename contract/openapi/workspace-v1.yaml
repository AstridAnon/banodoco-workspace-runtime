openapi: 3.1.0
info:
  title: Banodoco Workspace Runtime
  version: 1.0.0
  description: Product-neutral local workspace protocol.
  x-protocol-id: workspace.v1
servers:
  - url: http://127.0.0.1
security:
  - bearerAuth: []
paths:
  /v1/health:
    get:
      operationId: health
      security: []
      responses:
        '200': { description: Healthy, content: { application/json: { schema: { $ref: './schemas/health.json' } } } }
  /v1/handshake:
    post:
      operationId: handshake
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: './schemas/handshake.json' } } }
      responses:
        '200': { description: Scoped session, content: { application/json: { schema: { $ref: '#/components/schemas/HandshakeResponse' } } } }
  /v1/realm:
    get:
      operationId: getRealm
      responses:
        '200': { description: Current scoped realm, content: { application/json: { schema: { $ref: './schemas/realm.json' } } } }
  /v1/doctor:
    get:
      operationId: doctor
      responses:
        '200': { description: Read-only integrity and support-state report, content: { application/json: { schema: { $ref: './schemas/doctor.json' } } } }
  /v1/backup:
    post:
      operationId: createBackup
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateBackup' } } } }
      responses: { '201': { description: Verified online backup, content: { application/json: { schema: { $ref: './schemas/backup.json' } } } } }
  /v1/restore:
    post:
      operationId: restoreBackup
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RestoreBackup' } } } }
      responses: { '201': { description: Prepared inactive restored realm, content: { application/json: { schema: { $ref: './schemas/backup.json' } } } } }
  /v1/export:
    get:
      operationId: exportRealm
      responses: { '200': { description: Structured realm export, content: { application/json: { schema: { $ref: './schemas/export.json' } } } } }
  /v1/realm/tombstone:
    post:
      operationId: tombstoneRealm
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/LifecycleRequest' } } } }
      responses: { '200': { description: Logical realm removal, content: { application/json: { schema: { $ref: './schemas/realm-lifecycle.json' } } } } }
  /v1/realm/recover:
    post:
      operationId: recoverRealm
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryRequest' } } } }
      responses: { '200': { description: Recovered realm tombstone, content: { application/json: { schema: { $ref: './schemas/realm-lifecycle.json' } } } } }
  /v1/realm/purge:
    post:
      operationId: purgeRealm
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PurgeRealm' } } } }
      responses: { '409': { $ref: '#/components/responses/Conflict' } }
  /v1/projects:
    get:
      operationId: listProjects
      parameters: [ { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: Projects, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectPage' } } } }
    post:
      operationId: createProject
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateProject' } } }
      responses:
        '201': { description: Created with committed receipt, content: { application/json: { schema: { $ref: '#/components/schemas/CommittedMutation' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/projects/{project_id}:
    get:
      operationId: getProject
      parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
      responses:
        '200': { description: Project, content: { application/json: { schema: { $ref: './schemas/project.json' } } } }
    patch:
      operationId: updateProject
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateProject' } } }
      responses:
        '200': { description: Updated project, content: { application/json: { schema: { $ref: './schemas/project.json' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/projects/selection:
    get:
      operationId: currentProject
      responses:
        '200': { description: Actor's effective project selection, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectSelection' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: selectProject
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SelectProject' } } }
      responses:
        '200': { description: Persisted actor-scoped selection with committed receipt, content: { application/json: { schema: { $ref: '#/components/schemas/CommittedMutation' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/projects/{project_id}/documents:
    get:
      operationId: listDocuments
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses: { '200': { description: Project documents, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentPage' } } } } }
    post:
      operationId: createDocument
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateDocument' } } } }
      responses: { '201': { description: Versioned document with committed receipt, content: { application/json: { schema: { $ref: '#/components/schemas/CommittedMutation' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/projects/{project_id}/documents/{document_id}:
    get:
      operationId: getDocument
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/DocumentId' } ]
      responses: { '200': { description: Versioned document, content: { application/json: { schema: { $ref: './schemas/document.json' } } } } }
    patch:
      operationId: updateDocument
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/DocumentId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateDocument' } } } }
      responses: { '200': { description: Updated document with committed receipt, content: { application/json: { schema: { $ref: '#/components/schemas/CommittedMutation' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/projects/{project_id}/objects:
    get:
      operationId: listProjectObjects
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses: { '200': { description: Project-scoped managed objects, content: { application/json: { schema: { $ref: '#/components/schemas/ManagedObjectPage' } } } } }
    post:
      operationId: ingestProjectObject
      description: Ingest bytes into runtime CAS and associate the resulting managed object with this project before task settlement.
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
      responses: { '201': { description: Managed object with committed receipt, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectObjectMutation' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/projects/{project_id}/tasks:
    get:
      operationId: listProjectTasks
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses: { '200': { description: Project tasks, content: { application/json: { schema: { $ref: '#/components/schemas/TaskPage' } } } } }
  /v1/projects/{project_id}/runs:
    get:
      operationId: listProjectRuns
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses: { '200': { description: Project runs, content: { application/json: { schema: { $ref: '#/components/schemas/RunPage' } } } } }
  /v1/projects/{project_id}/timelines:
    post:
      operationId: createTimeline
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateTimeline' } } } }
      responses: { '201': { description: Timeline with committed receipt, content: { application/json: { schema: { $ref: '#/components/schemas/CommittedMutation' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
    get:
      operationId: listTimelines
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses: { '200': { description: Timelines, content: { application/json: { schema: { $ref: '#/components/schemas/TimelinePage' } } } } }
  /v1/projects/{project_id}/timeline-documents:
    post:
      operationId: createTimelineDocument
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateTimelineDocument' } } } }
      responses: { '201': { description: Timeline and composition document committed atomically, content: { application/json: { schema: { $ref: '#/components/schemas/CommittedMutation' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/timelines/{timeline_id}:
    get:
      operationId: getTimeline
      parameters: [ { $ref: '#/components/parameters/TimelineId' } ]
      responses: { '200': { description: Timeline, content: { application/json: { schema: { $ref: './schemas/timeline.json' } } } } }
    patch:
      operationId: updateTimeline
      parameters: [ { $ref: '#/components/parameters/TimelineId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateTimeline' } } } }
      responses: { '200': { description: Updated timeline with committed receipt, content: { application/json: { schema: { $ref: '#/components/schemas/CommittedMutation' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/timelines/{timeline_id}/history:
    get:
      operationId: listTimelineHistory
      parameters: [ { $ref: '#/components/parameters/TimelineId' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses: { '200': { description: Timeline revisions, content: { application/json: { schema: { $ref: '#/components/schemas/TimelineRevisionPage' } } } } }
  /v1/timelines/{timeline_id}/replace-clip:
    post:
      operationId: replaceTimelineClip
      description: Atomically replace one explicit composition clip with a managed object owned by the timeline project while preserving authored timing and unrelated document state.
      parameters: [ { $ref: '#/components/parameters/TimelineId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: './schemas/timeline-clip-replacement.json' } } } }
      responses: { '200': { description: Updated canonical timeline with committed receipt, content: { application/json: { schema: { $ref: '#/components/schemas/CommittedMutation' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/timelines/{timeline_id}/diff:
    get:
      operationId: diffTimeline
      parameters:
        - { $ref: '#/components/parameters/TimelineId' }
        - { name: from_version, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: to_version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses: { '200': { description: Timeline revision diff, content: { application/json: { schema: { $ref: './schemas/timeline-diff.json' } } } } }
  /v1/timelines/{timeline_id}/archive:
    post:
      operationId: archiveTimeline
      parameters: [ { $ref: '#/components/parameters/TimelineId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExpectedVersion' } } } }
      responses: { '200': { description: Archived timeline with committed receipt, content: { application/json: { schema: { $ref: '#/components/schemas/CommittedMutation' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/timelines/{timeline_id}/recover:
    post:
      operationId: recoverTimeline
      parameters: [ { $ref: '#/components/parameters/TimelineId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecoverTimeline' } } } }
      responses: { '200': { description: Recovered timeline with committed receipt, content: { application/json: { schema: { $ref: '#/components/schemas/CommittedMutation' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/timelines/{timeline_id}/shots:
    post:
      operationId: createShot
      parameters: [ { $ref: '#/components/parameters/TimelineId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Shot' } } } }
      responses: { '201': { description: Shot, content: { application/json: { schema: { $ref: '#/components/schemas/Shot' } } } } }
  /v1/shots/{shot_id}:
    get:
      operationId: getShot
      parameters: [ { $ref: '#/components/parameters/ShotId' } ]
      responses: { '200': { description: Shot, content: { application/json: { schema: { $ref: '#/components/schemas/Shot' } } } } }
    patch:
      operationId: updateShot
      parameters: [ { $ref: '#/components/parameters/ShotId' }, { name: Idempotency-Key, in: header, required: false, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateShot' } } } }
      responses: { '200': { description: Updated shot, content: { application/json: { schema: { $ref: '#/components/schemas/Shot' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/shots/{shot_id}/archive:
    post:
      operationId: archiveShot
      parameters: [ { $ref: '#/components/parameters/ShotId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExpectedVersion' } } } }
      responses: { '200': { description: Archived shot, content: { application/json: { schema: { $ref: '#/components/schemas/Shot' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/shots/{shot_id}/recover:
    post:
      operationId: recoverShot
      parameters: [ { $ref: '#/components/parameters/ShotId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExpectedVersion' } } } }
      responses: { '200': { description: Recovered shot, content: { application/json: { schema: { $ref: '#/components/schemas/Shot' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/timelines/{timeline_id}/references:
    post:
      operationId: createReference
      parameters: [ { $ref: '#/components/parameters/TimelineId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Reference' } } } }
      responses: { '201': { description: Reference, content: { application/json: { schema: { $ref: '#/components/schemas/Reference' } } } } }
  /v1/projects/{project_id}/shots:
    post:
      operationId: createProjectShot
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectShotCreate' } } } }
      responses: { '201': { description: Project shot mutation, content: { application/json: { schema: { $ref: '#/components/schemas/CommittedMutation' } } } } }
    get:
      operationId: listProjectShots
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }, { name: include_archived, in: query, required: false, schema: { type: boolean, default: false } } ]
      responses: { '200': { description: Project shots, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectShotPage' } } } } }
  /v1/projects/{project_id}/shots/{shot_id}:
    get:
      operationId: getProjectShot
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/ShotId' } ]
      responses: { '200': { description: Project shot, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectShot' } } } } }
    patch:
      operationId: updateProjectShot
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/ShotId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectShotUpdate' } } } }
      responses: { '200': { description: Updated project shot mutation, content: { application/json: { schema: { $ref: '#/components/schemas/CommittedMutation' } } } } }
  /v1/projects/{project_id}/shots/{shot_id}/archive:
    post:
      operationId: archiveProjectShot
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/ShotId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExpectedVersion' } } } }
      responses: { '200': { description: Archived project shot mutation, content: { application/json: { schema: { $ref: '#/components/schemas/CommittedMutation' } } } } }
  /v1/projects/{project_id}/shots/{shot_id}/recover:
    post:
      operationId: recoverProjectShot
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/ShotId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExpectedVersion' } } } }
      responses: { '200': { description: Recovered project shot mutation, content: { application/json: { schema: { $ref: '#/components/schemas/CommittedMutation' } } } } }
  /v1/projects/{project_id}/shots/{shot_id}/items:
    post:
      operationId: addShotItem
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/ShotId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ShotItemCreate' } } } }
      responses: { '200': { description: Updated shot mutation, content: { application/json: { schema: { $ref: '#/components/schemas/CommittedMutation' } } } } }
  /v1/projects/{project_id}/shots/{shot_id}/items/{item_id}:
    delete:
      operationId: removeShotItem
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/ShotId' }, { name: item_id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExpectedVersion' } } } }
      responses: { '200': { description: Updated shot mutation, content: { application/json: { schema: { $ref: '#/components/schemas/CommittedMutation' } } } } }
  /v1/projects/{project_id}/shots/{shot_id}/promote-candidate:
    post:
      operationId: promoteProjectShotCandidate
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/ShotId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ShotCandidatePromotion' } } } }
      responses: { '200': { description: Atomically promoted shot candidate and stored invalidation report, content: { application/json: { schema: { $ref: '#/components/schemas/CommittedMutation' } } } } }
  /v1/projects/{project_id}/shots/{shot_id}/reorder:
    post:
      operationId: reorderShotItems
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/ShotId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ShotReorder' } } } }
      responses: { '200': { description: Updated shot mutation, content: { application/json: { schema: { $ref: '#/components/schemas/CommittedMutation' } } } } }
  /v1/projects/{project_id}/shot-text-bindings:
    get:
      operationId: listProjectShotTextBindings
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { name: shot_id, in: query, required: false, schema: { type: string } }, { name: kind, in: query, required: false, schema: { type: string, enum: [prompt, voiceover_script, transcript] } }, { name: slot, in: query, required: false, schema: { type: string } } ]
      responses: { '200': { description: Project-scoped shot text bindings, content: { application/json: { schema: { $ref: '#/components/schemas/ShotTextBindingPage' } } } } }
    post:
      operationId: setProjectShotTextBinding
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ShotTextBindingSet' } } } }
      responses: { '200': { description: Set text binding, content: { application/json: { schema: { $ref: '#/components/schemas/CommittedMutation' } } } } }
  /v1/projects/{project_id}/shot-text-bindings/{binding_id}:
    get:
      operationId: getProjectShotTextBinding
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/BindingId' } ]
      responses: { '200': { description: Shot text binding, content: { application/json: { schema: { $ref: '#/components/schemas/ShotTextBinding' } } } } }
    post:
      operationId: setProjectShotTextBindingById
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/BindingId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ShotTextBindingSetById' } } } }
      responses: { '200': { description: Set text binding, content: { application/json: { schema: { $ref: '#/components/schemas/CommittedMutation' } } } } }
  /v1/projects/{project_id}/shot-text-bindings/{binding_id}/rebind:
    post:
      operationId: rebindProjectShotTextBinding
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/BindingId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ShotTextBindingRebind' } } } }
      responses: { '200': { description: Rebound text binding, content: { application/json: { schema: { $ref: '#/components/schemas/CommittedMutation' } } } } }
  /v1/projects/{project_id}/references:
    post:
      operationId: createProjectReference
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectReferenceCreate' } } } }
      responses: { '201': { description: Project reference mutation, content: { application/json: { schema: { $ref: '#/components/schemas/CommittedMutation' } } } } }
    get:
      operationId: listProjectReferences
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }, { name: include_archived, in: query, required: false, schema: { type: boolean, default: false } } ]
      responses: { '200': { description: Project references, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectReferencePage' } } } } }
  /v1/projects/{project_id}/references/{reference_id}:
    get:
      operationId: getProjectReference
      parameters: [ { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/ReferenceId' } ]
      responses: { '200': { description: Project reference, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectReference' } } } } }
    patch:
